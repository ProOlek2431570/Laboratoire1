<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter une publication</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- jQuery UI -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
</head>
<body class="container mt-5">

<h2>Ajouter une publication</h2>

<form id="formPublication">

    <div class="mb-3">
        <label class="form-label">Titre</label>
        <input type="text" id="titre" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Auteur</label>
        <input type="text" id="auteur" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Contenu</label>
        <textarea id="contenu" class="form-control" rows="5" required></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Envoyer</button>
</form>

<div id="dialog-confirm" title="Confirmation" style="display:none;">
    <p>Voulez-vous vraiment ajouter cette publication ?</p>
</div>

<script src="script_ajouterPub.js"></script>

</body>
</html>
